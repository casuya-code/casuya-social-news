# Casuya Social News — Prometheus scrape config
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerting_rules.yml

scrape_configs:
  - job_name: casuya-server
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8000"]
        labels:
          service: casuya-social-news
          tier: app