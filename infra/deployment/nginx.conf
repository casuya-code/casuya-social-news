# Casuya Social News — Nginx reverse proxy
# Serves the FastAPI backend and static assets behind TLS.
#
# Usage:
#   sudo cp nginx.conf /etc/nginx/sites-available/casuya
#   sudo ln -sf /etc/nginx/sites-available/casuya /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream casuya_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name casuya.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name casuya.example.com;

    # TLS (replace with your actual cert paths)
    ssl_certificate /etc/letsencrypt/live/casuya.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/casuya.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (matches server body limit: 1 MB)
    client_max_body_size 1m;

    # API endpoints
    location /api/ {
        proxy_pass http://casuya_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # WebSocket endpoint
    location /api/v1/ws {
        proxy_pass http://casuya_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Static audio storage
    location /storage/ {
        proxy_pass http://casuya_backend;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Operator dashboard
    location /operator {
        proxy_pass http://casuya_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Docs (dev only — disable in production)
    location /docs {
        proxy_pass http://casuya_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://casuya_backend;
        proxy_set_header Host $host;
    }

    # Health check (no auth required)
    location = / {
        proxy_pass http://casuya_backend;
        proxy_set_header Host $host;
    }

    # Metrics (restrict to internal network)
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://casuya_backend;
    }

    # Default deny
    location / {
        return 404;
    }
}
